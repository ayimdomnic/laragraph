name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Main test matrix — PHP × Laravel, following Laravel's own support policy:
  #   Laravel 10 → PHP 8.2–8.3   Laravel 11 → PHP 8.2–8.4
  #   Laravel 12 → PHP 8.2–8.5   Laravel 13 → PHP 8.3–8.5
  # ---------------------------------------------------------------------------
  test:
    name: "PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.stability }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        laravel: ["10.*", "11.*", "12.*", "13.*"]
        stability: [prefer-stable]
        include:
          - laravel: "10.*"
            testbench: "^8.0"
          - laravel: "11.*"
            testbench: "^9.0"
          - laravel: "12.*"
            testbench: "^10.0"
          - laravel: "13.*"
            testbench: "^11.0"
          # Guard the lower bounds of every dependency constraint.
          - php: "8.2"
            laravel: "12.*"
            testbench: "^10.0"
            stability: prefer-lowest
        exclude:
          - laravel: "10.*"
            php: "8.4"
          - laravel: "10.*"
            php: "8.5"
          - laravel: "11.*"
            php: "8.5"
          - laravel: "13.*"
            php: "8.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, pdo, pdo_sqlite, json
          coverage: none

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          # Static-analysis / style tooling is not needed to run the suite and
          # pins newer Laravel versions than the package itself supports.
          composer remove --dev larastan/larastan phpstan/phpstan laravel/pint rector/rector --no-update --no-interaction
          composer require "illuminate/broadcasting:${{ matrix.laravel }}" \
                           "illuminate/contracts:${{ matrix.laravel }}" \
                           "illuminate/http:${{ matrix.laravel }}" \
                           "illuminate/routing:${{ matrix.laravel }}" \
                           "illuminate/support:${{ matrix.laravel }}" \
                           "illuminate/validation:${{ matrix.laravel }}" \
                           --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" \
                                 "orchestra/workbench:${{ matrix.testbench }}" \
                                 --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

  # ---------------------------------------------------------------------------
  # Code quality — PER-CS style, Rector drift and PHPStan / Larastan
  # ---------------------------------------------------------------------------
  quality:
    name: "Code Quality"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, pdo, pdo_sqlite, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit

      - name: Code style (Pint / PER-CS)
        run: composer lint

      - name: Rector (no pending upgrades)
        run: composer refactor:check

      - name: Static analysis (PHPStan / Larastan)
        run: composer phpstan

  # ---------------------------------------------------------------------------
  # Coverage gate — must stay at 100%
  # ---------------------------------------------------------------------------
  coverage:
    name: "Coverage"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, pdo, pdo_sqlite, json
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        run: |
          vendor/bin/phpunit \
            --coverage-clover build/coverage.xml \
            --coverage-text

      - name: Enforce 100% line coverage
        run: |
          php -r '
            $m   = simplexml_load_file("build/coverage.xml")->project->metrics;
            $pct = (float) $m["coveredstatements"] / max(1, (float) $m["statements"]) * 100;
            printf("Line coverage: %.2f%%\n", $pct);
            exit($pct < 100.0 ? 1 : 0);
          '

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.xml
          fail_ci_if_error: false
