name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  # ---------------------------------------------------------------------------
  # Main test matrix — PHP × Laravel
  # ---------------------------------------------------------------------------
  test:
    name: "PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:     ["8.2", "8.3", "8.4"]
        laravel: ["10.*", "11.*", "12.*"]
        exclude:
          # Laravel 11+ requires PHP 8.2+, already handled; no exclusions needed
          - php: "8.1"   # never included, just being explicit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, pdo, pdo_sqlite, json
          coverage: none

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" \
                           "illuminate/http:${{ matrix.laravel }}" \
                           "illuminate/routing:${{ matrix.laravel }}" \
                           "illuminate/support:${{ matrix.laravel }}" \
                           "illuminate/validation:${{ matrix.laravel }}" \
                           --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

  # ---------------------------------------------------------------------------
  # Static analysis — PHPStan / Larastan
  # ---------------------------------------------------------------------------
  static-analysis:
    name: "Static Analysis (PHPStan)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, pdo, pdo_sqlite, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: composer phpstan

  # ---------------------------------------------------------------------------
  # Coverage gate — PHP 8.2 / Laravel 12 only, must be 100%
  # ---------------------------------------------------------------------------
  coverage:
    name: "Coverage (PHP 8.2 / Laravel 12)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, pdo, pdo_sqlite, json, xdebug
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        env:
          XDEBUG_MODE: coverage
        run: |
          vendor/bin/phpunit \
            --coverage-clover build/coverage.xml \
            --coverage-text

      - name: Enforce 100% line coverage
        run: |
          LINES=$(grep -oP 'Lines:\s+\K[0-9.]+(?=%)' build/coverage.xml | head -1 || \
                  php -r "
                    \$xml = simplexml_load_file('build/coverage.xml');
                    \$m   = \$xml->project->metrics;
                    \$pct = (float)\$m['coveredstatements'] / max(1, (float)\$m['statements']) * 100;
                    echo number_format(\$pct, 2);
                  ")
          echo "Line coverage: ${LINES}%"
          php -r "if ((float)'${LINES}' < 100.0) { echo \"Coverage ${LINES}% is below the 100% requirement.\n\"; exit(1); }"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage.xml
          fail_ci_if_error: false
